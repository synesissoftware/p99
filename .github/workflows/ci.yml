name: CI

on:
  push:
    branches:
      - master
      - dev
      - boilerplate
      - idiomatic
      - rc1
      - rc2
      - rc3
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cell:
    name: CI (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-debug
            os: ubuntu-latest
            build_type: Debug
            c_compiler: gcc
            cpp_compiler: g++
          - id: ubuntu-release
            os: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            run_benchmarks: true
            build_docs: true
          - id: ubuntu-debug-compact
            os: ubuntu-latest
            build_type: Debug
            c_compiler: gcc
            cpp_compiler: g++
            compact_histogram: ON
          - id: ubuntu-release-compact
            os: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            compact_histogram: ON
            run_benchmarks: true
          - id: macos-debug
            os: macos-latest
            build_type: Debug
            c_compiler: clang
            cpp_compiler: clang++
          - id: macos-release
            os: macos-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            run_benchmarks: true
          - id: windows-mingw-debug
            os: windows-latest
            build_type: Debug
            c_compiler: gcc
            cpp_compiler: g++
            toolchain: mingw
          - id: windows-mingw-release
            os: windows-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            toolchain: mingw
            run_benchmarks: true
          - id: windows-msvc-debug
            os: windows-latest
            build_type: Debug
            c_compiler: cl
            cpp_compiler: cl
          - id: windows-msvc-release
            os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
            run_benchmarks: true
    uses: ./.github/workflows/ci-cell.yml
    with:
      cell-id: ${{ matrix.id }}
      os: ${{ matrix.os }}
      c-compiler: ${{ matrix.c_compiler }}
      cpp-compiler: ${{ matrix.cpp_compiler }}
      build-type: ${{ matrix.build_type }}
      toolchain: ${{ matrix.toolchain }}
      compact-histogram: ${{ matrix.compact_histogram }}
      run-benchmarks: ${{ matrix.run_benchmarks == true }}
      build-docs: ${{ matrix.build_docs == true }}
    secrets: inherit

  sanitizer:
    name: Sanitizer (ASan + UBSan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build

      - name: Test
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure --timeout 120
